<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Link Test</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;color:#e8ecf4;font:28px/1.3 sans-serif}
#w{padding:30px 60px}#cols{display:flex}#list{width:900px;height:720px;overflow:auto}#msg{flex:1;margin:8px 0 0 30px!important;height:700px;overflow:auto}
h1{margin:0 0 6px;font-size:44px}
.sub{color:#8d97ab;font-size:24px;margin-bottom:18px}
#idbox{font-size:30px;margin:10px 0 18px}
#idbox b{color:#7cc4ff;letter-spacing:2px}
.row{padding:9px 20px;margin:6px 0;border-radius:14px;background:#171b26;border:3px solid transparent}
.row.f{border-color:#7cc4ff;background:#1f2636}
.row small{display:block;color:#8d97ab;font-size:19px}
#msg{padding:16px 22px;border-radius:14px;background:#10141d;font-size:21px;white-space:pre-wrap;word-break:break-all}
.ok{color:#58d68d}.bad{color:#ff7b72}
</style></head><body><div id="w">
<h1>Link Test</h1>
<div class="sub">Does a link from one app open or play a video inside another app? Nothing here touches JoolzTV.</div>
<div id="idbox">Title / video ID: <b id="vid"></b> &nbsp; <span style="color:#8d97ab;font-size:22px">type digits on the remote, Yellow deletes</span></div>
<div id="apps" class="sub"></div>
<div id="cols"><div id="list"></div>
<div id="msg">Choose a test and press OK. Left/Right scroll this panel.</div></div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var vid = "80057281";                     // a Netflix title id; type another with the number keys
  var YT = "dQw4w9WgXcQ";
  var HB = "luna://org.webosbrew.hbchannel.service/exec";
  var AM = "luna://com.webos.applicationManager/";
  var cur = 0;

  var tests = [
    { t: "Netflix: just open the app", s: "launch id netflix, no parameters", id: "netflix", p: function () { return {}; } },
    { t: "Netflix: play, DIAL style", s: "contentTarget = source_type=4&m=https://www.netflix.com/watch/ID (works: opens the title and plays). Type another ID with the number keys.", id: "netflix", p: function () { return { contentTarget: "source_type=4&m=https://www.netflix.com/watch/" + vid }; } },
    { t: "Netflix Watch: start logging", s: "Background logger for 30 min. When Netflix starts it records where Netflix lives (sandbox, mounts, open files) and then watches those folders for new or changed files. Start it, open Netflix, pick a profile, play a few seconds.", inspect: "nfstart" },
    { t: "Netflix Watch: report", s: "Shows what the logger saw. Open this after you used Netflix. Left/Right scroll.", inspect: "nfreport", post: "nfreport" },
    { t: "Netflix Watch: stop", s: "Stops the logger (it also stops by itself after 30 min). The log stays until the next start.", inspect: "nfstop" }
  ];

  function say(h) { $("msg").innerHTML = h; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function paint() {
    $("vid").textContent = vid || "(empty)";
    var h = "";
    for (var i = 0; i < tests.length; i++) h += '<div class="row' + (i === cur ? " f" : "") + '" id="r' + i + '">' + esc(tests[i].t) + "<small>" + esc(tests[i].s) + "</small></div>";
    var sc = $("list").scrollTop; $("list").innerHTML = h; $("list").scrollTop = sc;
  }

  function call(uri, params, cb) {
    try {
      var b = new PalmServiceBridge();
      b.onservicecallback = function (m) { var j; try { j = JSON.parse(m); } catch (e) { j = { returnValue: false, errorText: "Bad answer: " + m }; } cb(j); };
      b.call(uri, JSON.stringify(params || {}));
    } catch (e) { cb({ returnValue: false, errorText: "No webOS service bridge (only works on the TV)" }); }
  }
  function sq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

  // Direct call first. If webOS refuses it, the same call is made as root through Homebrew Channel's service.
  // Short, limited searches only: a find over the whole TV can run for minutes. Scripts go through base64 so quotes cannot break them.
  var INSPECT = {};
  // Netflix Watch: a background logger (read only: it only lists names, sizes and times, never file contents). Stops by itself after 30 min.
  var NFLOG = "/var/lib/webosbrew/joolay-netflix-log.txt", NFSH = "/var/lib/webosbrew/joolay-nfwatch.sh";
  var WATCH = [
    "LOG=/var/lib/webosbrew/joolay-netflix-log.txt",
    "PIDF=/tmp/joolay-nfwatch.pid",
    "[ -f $PIDF ] && kill $(cat $PIDF) 2>/dev/null",
    "echo $$ > $PIDF",
    ": > $LOG",
    "log() { echo \"$(date +%s) $1 $2\" >> $LOG; }",
    "STATIC=\"\"",
    "for d in $(ls -d /var/palm/jail/*etflix* /var/palm/data/*etflix* /media/cryptofs/apps/usr/palm/data/*etflix* 2>/dev/null); do",
    "  case \"$d\" in",
    "    /var/palm/jail/*) for s in var tmp media mnt home; do [ -d \"$d/$s\" ] && STATIC=\"$STATIC $d/$s\"; done ;;",
    "    *) STATIC=\"$STATIC $d\" ;;",
    "  esac",
    "done",
    "log START \"starting folders:$STATIC (more are added when Netflix runs, from the files it opens)\"",
    "W=/tmp/jnf; mkdir -p $W; : > $W/files; : > $W/open; : > $W/dirs; : > $W/seen",
    "FG=x; PP=x; first=1; n=0; fgfail=0; ROOTP=\"\"; LASTD=x",
    "END=$(( $(date +%s) + 1800 ))",
    "while [ $(date +%s) -lt $END ]; do",
    "  n=$((n+1))",
    "  f=$(timeout 3 luna-send -n 1 luna://com.webos.service.applicationManager/getForegroundAppInfo '{}' 2>/dev/null | sed -n 's/.*\"appId\" *: *\"\\([^\"]*\\)\".*/\\1/p' | head -1)",
    "  if [ -z \"$f\" ] && [ $fgfail -eq 0 ]; then log FGFAIL \"could not read the app in front (logged once)\"; fgfail=1; fi",
    "  if [ -n \"$f\" ] && [ \"$f\" != \"$FG\" ]; then log FG \"app in front: $f\"; FG=$f; fi",
    "  P=$(ps 2>/dev/null | grep -i netflix | grep -v grep | sed 's/^ *\\([0-9]*\\) .*/\\1/' | tr '\\n' ' ')",
    "  [ -z \"$P\" ] && P=none",
    "  if [ \"$P\" != \"$PP\" ]; then",
    "    log PROC \"netflix process ids: $P\"; PP=$P",
    "    for pid in $P; do",
    "      [ \"$pid\" = none ] && continue",
    "      grep -qx $pid $W/seen && continue",
    "      echo $pid >> $W/seen",
    "      log INFO \"pid $pid command: $(tr '\\0' ' ' < /proc/$pid/cmdline 2>/dev/null | head -c 160)\"",
    "      r=$(readlink /proc/$pid/root 2>/dev/null); [ -z \"$ROOTP\" ] && [ \"$r\" != \"/\" ] && ROOTP=$r",
    "      log INFO \"pid $pid sandbox root: $r   working folder: $(readlink /proc/$pid/cwd 2>/dev/null)\"",
    "      grep -v -E ' - (proc|sysfs|cgroup|cgroup2|devpts|mqueue|debugfs|securityfs|devtmpfs|configfs|fusectl) ' /proc/$pid/mountinfo 2>/dev/null | head -40 | while read a b c root mp rest; do log MOUNT \"$mp   (from $root)   $(echo \"$rest\" | sed 's/.* - //')\"; done",
    "    done",
    "  fi",
    "  : > $W/open.new",
    "  if [ \"$P\" != none ]; then for pid in $P; do ls -l /proc/$pid/fd 2>/dev/null | sed 's/.* -> //' | grep '^/' | grep -v -E '^/(dev|proc|sys)/'; done | sort -u > $W/open.new; fi",
    "  if [ $first -eq 0 ]; then diff $W/open $W/open.new | grep '^>' | head -30 | while read a p; do log OPEN \"file now open: $p\"; done; fi",
    "  cp $W/open.new $W/open",
    "  sed 's#/[^/]*$##' $W/open.new | grep -E '^/(var|media|mnt|tmp|home)' | sort -u >> $W/dirs",
    "  DIRS=\"$STATIC\"",
    "  for d in $(sort -u $W/dirs | head -12); do",
    "    [ -d \"$d\" ] && DIRS=\"$DIRS $d\"",
    "    [ -n \"$ROOTP\" ] && [ -d \"$ROOTP$d\" ] && DIRS=\"$DIRS $ROOTP$d\"",
    "  done",
    "  DIRS=$(echo $DIRS | tr ' ' '\\n' | sort -u | tr '\\n' ' ')",
    "  t0=$(date +%s)",
    "  : > $W/files.new",
    "  [ -n \"$DIRS\" ] && timeout 12 find $DIRS -xdev -maxdepth 4 -type f -printf '%T@ %s %p\\n' 2>/dev/null | sed 's/^\\([0-9]*\\)\\.[0-9]* /\\1 /' | sort -u -k3 > $W/files.new",
    "  took=$(( $(date +%s) - t0 ))",
    "  if [ \"$DIRS\" != \"$LASTD\" ]; then log WATCH \"now watching: $DIRS\"; log BASE \"$(wc -l < $W/files.new) files there now (scan took $took s)\"; LASTD=$DIRS",
    "  else diff $W/files $W/files.new | grep '^>' | head -40 | while read a t s p; do log FILE \"new or changed: $p ($s bytes)\"; done; fi",
    "  [ $took -ge 10 ] && log SLOW \"file scan took $took s (stopped at 12 s)\"",
    "  mv $W/files.new $W/files",
    "  [ $((n % 8)) -eq 0 ] && log TICK \"still running (cycle $n)\"",
    "  first=0",
    "  sleep 3",
    "done",
    "log STOP \"30 minutes passed\"",
    "rm -f $PIDF"
  ].join("\n") + "\n";
  INSPECT.nfstart = "mkdir -p /var/lib/webosbrew; echo " + btoa(WATCH) + " | base64 -d > " + NFSH + "; (sh " + NFSH + " >/dev/null 2>&1 &); sleep 3; echo 'Netflix Watch is running (30 min). Now open Netflix, pick a profile, play something, then come back here and open Netflix Watch: report.'; echo; tail -n 4 " + NFLOG;
  INSPECT.nfstop = "[ -f /tmp/joolay-nfwatch.pid ] && kill $(cat /tmp/joolay-nfwatch.pid) 2>/dev/null; rm -f /tmp/joolay-nfwatch.pid; echo \"$(date +%s) STOP stopped by you\" >> " + NFLOG + "; echo 'Netflix Watch stopped. Open Netflix Watch: report to read the log.'";
  INSPECT.nfreport = "test -f " + NFLOG + " || echo 'NOLOG'; tail -n 260 " + NFLOG + " 2>/dev/null; echo '--running:'; [ -f /tmp/joolay-nfwatch.pid ] && kill -0 $(cat /tmp/joolay-nfwatch.pid) 2>/dev/null && echo yes || echo no";
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  var POST = {
    nfreport: function (out) {
      if (/^NOLOG/.test(out)) return "No log yet. Run Netflix Watch: start logging first.";
      var ls = out.split("\n"), run = /--running:\s*yes/.test(out), res = [], c = { FILE: 0, OPEN: 0, MOUNT: 0, WATCH: 0 }, i, m, d;
      for (i = 0; i < ls.length; i++) {
        m = /^(\d{9,})\s+([A-Z]+)\s*(.*)$/.exec(ls[i]); if (!m) continue;
        d = new Date(+m[1] * 1000); if (c[m[2]] !== undefined) c[m[2]]++;
        res.push(pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + "  " + m[2] + "  " + m[3]);
      }
      return "Logger " + (run ? "is running" : "is stopped") + ". Mount lines: " + c.MOUNT + ". Files opened: " + c.OPEN + ". Folders watched: " + c.WATCH + ". New or changed files: " + c.FILE + ".\n" +
        "INFO and MOUNT lines show where Netflix runs and which folders are linked into it. OPEN lines are files it opened, WATCH lines the folders being watched, FILE lines what changed there. FILE lines right when you picked a profile are the profile files.\n\n" + res.join("\n");
    }
  };
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function inspect(test) {
    var finished = false, t0 = new Date().getTime();
    say("Reading the TV (read only)… this can take up to a minute.");
    var dots = setInterval(function () { if (!finished) say("Reading the TV (read only)… " + Math.round((new Date().getTime() - t0) / 1000) + " s"); }, 3000);
    var give = setTimeout(function () { if (!finished) { finished = true; clearInterval(dots); say('<span class="bad">No answer from Homebrew Channel after 90 s.</span> Its service may be busy or not reachable.'); } }, 90000);
    call(HB, { command: "echo " + b64(INSPECT[test.inspect]) + " | base64 -d | sh" }, function (x) {
      if (finished) return; finished = true; clearInterval(dots); clearTimeout(give);
      var out = String(x.stdoutString || x.stdout || "") + String(x.stderrString || x.stderr || "");
      if (x.returnValue === false && !out) return say('<span class="bad">Could not read:</span> ' + esc(x.errorText || JSON.stringify(x)));
      $("msg").scrollTop = 0;
      var shown = test.post ? POST[test.post](out) : out; say(esc(test.post ? shown.slice(-6000) : (shown.slice(0, 6000) || "(nothing found). Raw answer: " + JSON.stringify(x).slice(0, 300))));
    });
  }
  function launch(test) {
    if (test.inspect) return inspect(test);
    var params = test.p(), body = { id: test.id, params: params };
    say("Launching " + esc(test.id) + "…\n" + esc(JSON.stringify(params)));
    call(AM + "launch", body, function (r) {
      if (r.returnValue !== false) return say('<span class="ok">Direct call accepted.</span>\n' + esc(JSON.stringify(r)) + "\nIf " + esc(test.id) + " opened on the right video, this link works.");
      var why = r.errorText || JSON.stringify(r);
      say("Direct call refused: " + esc(why) + "\nTrying as root…");
      call(HB, { command: "luna-send-pub -n 1 -f " + AM + "launch " + sq(JSON.stringify(body)) }, function (x) {
        var out = String(x.stdoutString || x.stdout || "") + String(x.stderrString || x.stderr || "");
        var good = x.returnValue !== false && /"returnValue"\s*:\s*true/.test(out);
        say((good ? '<span class="ok">Root call accepted.</span>' : '<span class="bad">Root call failed.</span>') + "\nDirect: " + esc(why) + "\nRoot: " + esc(out.replace(/\s+/g, " ").slice(0, 300) || JSON.stringify(x)) + (good ? "\nIf " + esc(test.id) + " opened on the right video, this link works." : ""));
      });
    });
  }

  function listApps() {
    call(AM + "listApps", {}, function (r) {
      var a = r.apps || [], found = [], i;
      for (i = 0; i < a.length; i++) if (/netflix|youtube|prime|disney|hbo|apple/i.test(a[i].id)) found.push(a[i].id + (a[i].version ? " " + a[i].version : ""));
      $("apps").textContent = r.returnValue === false ? "Could not read the app list (" + (r.errorText || "no answer") + ")." : (found.length ? "Streaming apps on this TV: " + found.join(", ") : "No streaming apps found in the list.");
    });
  }

  function move(d) { cur = (cur + d + tests.length) % tests.length; paint(); var r = $("r" + cur); if (r) { var l = $("list"); if (r.offsetTop < l.scrollTop) l.scrollTop = r.offsetTop - 6; else if (r.offsetTop + r.offsetHeight > l.scrollTop + l.clientHeight) l.scrollTop = r.offsetTop + r.offsetHeight - l.clientHeight + 6; } }
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k === 38) { move(-1); e.preventDefault(); }
    else if (k === 40) { move(1); e.preventDefault(); }
    else if (k === 37) { $("msg").scrollTop -= 400; e.preventDefault(); }
    else if (k === 39) { $("msg").scrollTop += 400; e.preventDefault(); }
    else if (k === 13) { launch(tests[cur]); e.preventDefault(); }
    else if (k >= 48 && k <= 57) { if (vid.length < 12) vid += String(k - 48); paint(); }
    else if (k === 405) { vid = vid.slice(0, -1); paint(); }              // yellow
    else if (k === 461 || k === 27 || k === 8) { try { window.close(); } catch (x) {} }
  });
  $("list").addEventListener("click", function (e) {      // Magic Remote pointer
    var n = e.target; while (n && n !== $("list") && !/^r\d+$/.test(n.id || "")) n = n.parentNode;
    if (n && n.id) { cur = +n.id.slice(1); paint(); launch(tests[cur]); }
  });
  paint(); listApps();
})();
</script></body></html>
